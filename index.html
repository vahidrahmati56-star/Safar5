 // حرکت

   p.x=clamp(p.x+dx/l*sp*dt,-45,45);p.z=Math.max(p.z+dz/l*sp*dt,-L.km*U-6);let a=Math.atan2(dx,dz),d=a-player.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));player.rotation.y+=d*Math.min(1,dt*10);ph+=dt*sp*1.4;

 else if(R.menu){yaw+=dt*.15}
